name: Daily research refresh and publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm update-feed
      - run: pnpm build
      - name: Save the daily collection
        run: |
          git config user.name "daily-intelligence-bot"
          git config user.email "daily-intelligence-bot@users.noreply.github.com"
          git add src/data/daily-feed.json
          git diff --cached --quiet || git commit -m "chore: refresh daily research feed"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
